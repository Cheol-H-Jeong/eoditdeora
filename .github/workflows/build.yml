name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------
  # Fast sanity — tests on Linux.
  # -------------------------------------------------------------------
  test:
    name: Unit tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build deps (for lxml / pyhwp)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxml2-dev libxslt1-dev zlib1g-dev

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install \
            pytest pytest-asyncio \
            pydantic platformdirs tomli-w pathspec structlog xxhash watchdog \
            httpx click rich \
            lxml pypdfium2 pdfplumber python-docx openpyxl python-pptx \
            olefile xlrd extract-msg py7zr rarfile Pillow pyhwp \
            kiwipiepy lancedb pyarrow tantivy

      - name: Run pytest
        env:
          PYTHONPATH: core
        run: pytest core/tests -q

  # -------------------------------------------------------------------
  # Linux installer: PyInstaller → AppImage.
  # -------------------------------------------------------------------
  linux-installer:
    name: Build Linux AppImage
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System deps (build + Qt WebEngine runtime + AppImage tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libxml2-dev libxslt1-dev zlib1g-dev \
            binutils patchelf file desktop-file-utils libfuse2 \
            libxkbcommon-x11-0 libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxi6 \
            libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libgtk-3-0 libpango-1.0-0 libdrm2 libgbm1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Create venv + install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip wheel setuptools
          .venv/bin/pip install \
            pyinstaller pywebview PyQt6 PyQt6-WebEngine \
            pydantic platformdirs tomli-w pathspec structlog xxhash watchdog \
            lxml pypdfium2 pdfplumber python-docx openpyxl python-pptx olefile xlrd \
            extract-msg py7zr rarfile Pillow pyhwp \
            kiwipiepy lancedb pyarrow tantivy httpx click rich

      - name: Build AppImage
        run: |
          pnpm install
          bash installers/linux/build-appimage.sh 0.1.0

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: eoditdeora-linux-appimage
          path: installers/linux/out/Eoditdeora-*-x86_64.AppImage
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Windows installer: PyInstaller → Inno Setup.
  # -------------------------------------------------------------------
  windows-installer:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Create venv + install deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install --upgrade pip wheel setuptools
          .\.venv\Scripts\pip install `
            pyinstaller pywebview PyQt6 PyQt6-WebEngine `
            pydantic platformdirs tomli-w pathspec structlog xxhash watchdog `
            lxml pypdfium2 pdfplumber python-docx openpyxl python-pptx olefile xlrd `
            extract-msg py7zr rarfile Pillow pyhwp `
            kiwipiepy lancedb pyarrow tantivy httpx click rich

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # ISCC ships at a fixed path; expose it on PATH for this job.
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"

      - name: Generate Windows icon (ImageMagick → fallback Pillow)
        shell: pwsh
        run: |
          Copy-Item installers/linux/icon.svg installers/windows/icon.svg -Force
          $magick = (Get-Command magick -ErrorAction SilentlyContinue)
          if ($magick) {
            & $magick.Path -background none installers/windows/icon.svg -resize 256x256 installers/windows/icon.ico
          } else {
            # Fallback: synthesize a simple 256x256 PNG via Pillow then save as ICO.
            .\.venv\Scripts\python -c @"
from PIL import Image, ImageDraw
img = Image.new('RGBA', (256, 256), (11, 13, 17, 255))
d = ImageDraw.Draw(img)
d.ellipse((60, 70, 180, 190), outline=(138, 180, 255, 255), width=14)
d.line((165, 170, 220, 225), fill=(138, 180, 255, 255), width=14)
img.save('installers/windows/icon.ico', sizes=[(256, 256)])
"@
          }

      - name: Build installer
        shell: pwsh
        run: |
          pnpm install
          .\installers\windows\build-installer.ps1 -Version 0.1.0

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: eoditdeora-windows-installer
          path: installers/windows/out/Eoditdeora-*-setup.exe
          if-no-files-found: error
