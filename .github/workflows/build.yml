name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze-core:
    name: Freeze Python sidecar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: eoditdeora-core-linux-x64
            exe_suffix: ""
          - os: windows-latest
            artifact: eoditdeora-core-windows-x64
            exe_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        shell: bash
        run: |
          pytest core/tests -q

      - name: Freeze with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name eoditdeora-core \
            --paths core \
            --collect-all kiwipiepy \
            --collect-all tantivy \
            --collect-all lancedb \
            --collect-all pyarrow \
            --collect-all pdfplumber \
            --collect-all pypdfium2 \
            --collect-all hwp5 \
            core/eoditdeora/api/rpc_server.py

      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/eoditdeora-core${{ matrix.exe_suffix }}

  build-desktop:
    name: Bundle desktop (${{ matrix.os }})
    needs: freeze-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            sidecar_artifact: eoditdeora-core-linux-x64
            sidecar_name: eoditdeora-core
          - os: windows-latest
            target: windows
            sidecar_artifact: eoditdeora-core-windows-x64
            sidecar_name: eoditdeora-core.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Linux system deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Download frozen sidecar
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sidecar_artifact }}
          path: apps/shell/bin

      - name: Make sidecar executable (Linux)
        if: matrix.target == 'linux'
        run: chmod +x apps/shell/bin/${{ matrix.sidecar_name }}

      - name: Install UI deps
        run: pnpm install

      - name: Build UI
        run: pnpm --filter eoditdeora-ui build

      - name: Build Tauri bundle
        working-directory: apps/shell
        run: |
          cargo install tauri-cli --version "^2.2" --locked
          cargo tauri build

      - name: Upload Linux installers
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: eoditdeora-linux-installers
          path: |
            apps/shell/target/release/bundle/appimage/*.AppImage
            apps/shell/target/release/bundle/deb/*.deb
            apps/shell/target/release/bundle/rpm/*.rpm

      - name: Upload Windows installers
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: eoditdeora-windows-installers
          path: apps/shell/target/release/bundle/msi/*.msi
