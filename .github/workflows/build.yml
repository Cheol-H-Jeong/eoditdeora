name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Fast sanity — tests on Linux.
  # -------------------------------------------------------------------
  test:
    name: Unit tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install kiwipiepy tantivy lancedb pyarrow httpx xxhash \
                      watchdog pathspec structlog tomli-w platformdirs \
                      pydantic lxml pypdfium2 pdfplumber python-docx \
                      openpyxl python-pptx olefile xlrd extract-msg \
                      py7zr rarfile Pillow pyhwp click rich
      - name: Run pytest
        run: pytest core/tests -q

  # -------------------------------------------------------------------
  # Linux installer: PyInstaller → AppImage.
  # -------------------------------------------------------------------
  linux-installer:
    name: Build Linux AppImage
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils patchelf file desktop-file-utils libfuse2 \
            libxkbcommon-x11-0 libegl1 libxcb-cursor0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxi6 libasound2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Create venv + install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install \
            pyinstaller pywebview PyQt6 PyQt6-WebEngine \
            pydantic platformdirs tomli-w pathspec structlog xxhash watchdog \
            lxml pypdfium2 pdfplumber python-docx openpyxl python-pptx olefile xlrd \
            extract-msg py7zr rarfile Pillow pyhwp \
            kiwipiepy lancedb pyarrow tantivy httpx click rich

      - name: Build AppImage
        run: |
          pnpm install
          bash installers/linux/build-appimage.sh 0.1.0

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: eoditdeora-linux-appimage
          path: installers/linux/out/Eoditdeora-*-x86_64.AppImage

  # -------------------------------------------------------------------
  # Windows installer: PyInstaller → Inno Setup.
  # -------------------------------------------------------------------
  windows-installer:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Create venv + install deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install --upgrade pip
          .\.venv\Scripts\pip install `
            pyinstaller pywebview PyQt6 PyQt6-WebEngine `
            pydantic platformdirs tomli-w pathspec structlog xxhash watchdog `
            lxml pypdfium2 pdfplumber python-docx openpyxl python-pptx olefile xlrd `
            extract-msg py7zr rarfile Pillow pyhwp `
            kiwipiepy lancedb pyarrow tantivy httpx click rich

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Stage icon placeholder
        shell: pwsh
        run: |
          Copy-Item installers/linux/icon.svg installers/windows/icon.svg
          # Convert SVG → ICO via ImageMagick (pre-installed on windows-latest)
          magick -background none installers/windows/icon.svg -resize 256x256 installers/windows/icon.ico

      - name: Build installer
        shell: pwsh
        run: |
          pnpm install
          .\installers\windows\build-installer.ps1 -Version 0.1.0

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: eoditdeora-windows-installer
          path: installers/windows/out/Eoditdeora-*-setup.exe
