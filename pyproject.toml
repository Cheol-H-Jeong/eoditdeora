[project]
name = "eoditdeora"
version = "0.1.0"
description = "어딨더라 - local personal document knowledge base with semantic search + strict-provenance RAG"
authors = [{ name = "Eoditdeora Contributors" }]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # File watching & hashing
    "watchdog>=4.0",
    "xxhash>=3.5",
    # Parsers
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "olefile>=0.47",
    "xlrd>=2.0",
    "extract-msg>=0.50",
    "py7zr>=0.22",
    "rarfile>=4.2",
    "pyhwp>=0.1b15",
    "lxml>=5.3",
    "Pillow>=11.0",
    # Korean NLP
    "kiwipiepy>=0.20",
    # Storage & search
    "lancedb>=0.15",
    "pyarrow>=18.0",
    "tantivy>=0.22",
    # HTTP for llama.cpp
    "httpx>=0.28",
    # Utils
    "pydantic>=2.10",
    "platformdirs>=4.3",
    "rich>=13.9",
    "structlog>=24.4",
    "click>=8.1",
    "pathspec>=0.12",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.11",
]
ocr = [
    "surya-ocr>=0.6",
]

[project.scripts]
eddr = "eoditdeora.cli:main"
eoditdeora-core = "eoditdeora.api.rpc_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/eoditdeora"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["core/tests"]
pythonpath = ["core"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:lancedb",
    "ignore::DeprecationWarning:pathspec",
    "ignore:.*pathspec.*:DeprecationWarning",
]
